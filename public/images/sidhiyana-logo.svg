<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Sidhiyana Pvt Ltd">
  <title>Sidhiyana Pvt Ltd</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400&amp;display=swap');
      .wordmark { font-family: Orbitron, sans-serif; font-weight: 400; }
      @media (prefers-reduced-motion: reduce) {
        .sidhiyana-star-anim { display: none; }
      }
    </style>

    <linearGradient id="sidhiyanaFrameGrad" x1="70" y1="0" x2="370" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E84A8A"/>
      <stop offset="55%" stop-color="#FF7722"/>
      <stop offset="100%" stop-color="#FF7722"/>
    </linearGradient>

    <linearGradient id="sidhiyanaSaffronFill" x1="35" y1="0" x2="110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F25A7A"/>
      <stop offset="18%" stop-color="#FF7722"/>
      <stop offset="100%" stop-color="#FF7722"/>
    </linearGradient>

    <clipPath id="sidhiyanaTopBarClip">
      <path d="M42.5 110 H103 V117.5 A7.5 7.5 0 0 1 95.5 125 H42.5 A7.5 7.5 0 0 1 42.5 110 Z"/>
    </clipPath>
    <clipPath id="sidhiyanaReverseCClip">
      <rect x="35" y="142" width="68" height="15" rx="7.5"/>
      <rect x="88" y="142" width="15" height="45" rx="7.5"/>
      <rect x="35" y="174" width="68" height="15" rx="7.5"/>
    </clipPath>

    <linearGradient id="sidhiyanaStarTrail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#FFF4E8" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#FFE0C0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF7722" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sidhiyanaStarTrailCore" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="sidhiyanaStarGlow" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sidhiyanaStarHeadGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sidhiyanaSplashGlow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="0.75" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g stroke="url(#sidhiyanaFrameGrad)" stroke-width="2" stroke-linecap="square" fill="none">
    <path d="M68 68 H168 M68 68 V100"/>
    <path d="M342 68 H252 M342 68 V100"/>
    <path d="M68 232 H168 M68 232 V200"/>
    <path d="M342 232 H252 M342 232 V200"/>
  </g>

  <!-- Mild frame corner splash — TL → BR -->
  <g class="sidhiyana-star-anim">
    <path d="M68 100 V68 H168" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="21 153" opacity="0" filter="url(#sidhiyanaSplashGlow)">
      <animate attributeName="opacity" values="0;0;0.45;0.45;0;0" keyTimes="0;0.7;0.708;0.78;0.788;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;0;-132;-132" keyTimes="0;0.7;0.78;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </path>
    <path d="M68 100 V68 H168" fill="none" stroke="#FFFFFF" stroke-width="1.35" stroke-linecap="butt" stroke-dasharray="9 153" opacity="0">
      <animate attributeName="opacity" values="0;0;0.7;0.7;0;0" keyTimes="0;0.7;0.708;0.78;0.788;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;0;-132;-132" keyTimes="0;0.7;0.78;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </path>
  </g>
  <g class="sidhiyana-star-anim">
    <path d="M252 68 H342 V100" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="20 142" opacity="0" filter="url(#sidhiyanaSplashGlow)">
      <animate attributeName="opacity" values="0;0;0.45;0.45;0;0" keyTimes="0;0.75;0.758;0.83;0.838;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;0;-122;-122" keyTimes="0;0.75;0.83;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </path>
    <path d="M252 68 H342 V100" fill="none" stroke="#FFFFFF" stroke-width="1.35" stroke-linecap="butt" stroke-dasharray="9 142" opacity="0">
      <animate attributeName="opacity" values="0;0;0.7;0.7;0;0" keyTimes="0;0.75;0.758;0.83;0.838;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;0;-122;-122" keyTimes="0;0.75;0.83;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </path>
  </g>
  <g class="sidhiyana-star-anim">
    <path d="M68 200 V232 H168" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="21 153" opacity="0" filter="url(#sidhiyanaSplashGlow)">
      <animate attributeName="opacity" values="0;0;0.45;0.45;0;0" keyTimes="0;0.8;0.808;0.88;0.888;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;0;-132;-132" keyTimes="0;0.8;0.88;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </path>
    <path d="M68 200 V232 H168" fill="none" stroke="#FFFFFF" stroke-width="1.35" stroke-linecap="butt" stroke-dasharray="9 153" opacity="0">
      <animate attributeName="opacity" values="0;0;0.7;0.7;0;0" keyTimes="0;0.8;0.808;0.88;0.888;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;0;-132;-132" keyTimes="0;0.8;0.88;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </path>
  </g>
  <g class="sidhiyana-star-anim">
    <path d="M252 232 H342 V200" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="20 142" opacity="0" filter="url(#sidhiyanaSplashGlow)">
      <animate attributeName="opacity" values="0;0;0.45;0.45;0;0" keyTimes="0;0.85;0.858;0.93;0.938;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;0;-122;-122" keyTimes="0;0.85;0.93;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </path>
    <path d="M252 232 H342 V200" fill="none" stroke="#FFFFFF" stroke-width="1.35" stroke-linecap="butt" stroke-dasharray="9 142" opacity="0">
      <animate attributeName="opacity" values="0;0;0.7;0.7;0;0" keyTimes="0;0.85;0.858;0.93;0.938;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;0;-122;-122" keyTimes="0;0.85;0.93;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </path>
  </g>

  <g fill="url(#sidhiyanaSaffronFill)">
    <path d="M42.5 110 H103 V117.5 A7.5 7.5 0 0 1 95.5 125 H42.5 A7.5 7.5 0 0 1 42.5 110 Z"/>
    <rect x="35" y="142" width="68" height="15" rx="7.5"/>
    <rect x="88" y="142" width="15" height="45" rx="7.5"/>
    <rect x="35" y="174" width="68" height="15" rx="7.5"/>
  </g>

  <!-- 1) Bottom reverse-C — shooting star with launch zoom -->
  <g class="sidhiyana-star-anim" clip-path="url(#sidhiyanaReverseCClip)" filter="url(#sidhiyanaStarGlow)">
    <g>
      <animateMotion path="M42 181.5 H95.5 V149.5 H42" dur="11s" repeatCount="indefinite" rotate="auto"
        keyTimes="0;0.03;0.34;1" keyPoints="0;0;1;1" calcMode="spline"
        keySplines="0 0 1 1; 0.25 0 0.12 1; 0 0 1 1"/>
      <path d="M-24 0 L-0.9 -1.9 L0.35 0 L-0.9 1.9 Z" fill="url(#sidhiyanaStarTrail)" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M-18 0 L-0.2 -0.4 L0.7 0 L-0.2 0.4 Z" fill="url(#sidhiyanaStarTrailCore)" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
      </path>
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.12;1;1;0.4" keyTimes="0;0.02;0.05;0.2;0.32;1" dur="11s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="2.4" fill="#FFF8EC" opacity="0" filter="url(#sidhiyanaStarHeadGlow)">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
        </circle>
        <path d="M0 -5.4 L0.72 -0.72 L5.4 0 L0.72 0.72 L0 5.4 L-0.72 0.72 L-5.4 0 L-0.72 -0.72 Z" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
        </path>
        <circle cx="0" cy="0" r="1.25" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- 2) Top bar — after bottom; early stop + mild shine -->
  <g class="sidhiyana-star-anim" clip-path="url(#sidhiyanaTopBarClip)" filter="url(#sidhiyanaStarGlow)">
    <g>
      <animateMotion path="M42 117.5 H90" dur="11s" repeatCount="indefinite" rotate="auto"
        keyTimes="0;0.38;0.42;0.62;1" keyPoints="0;0;0;1;1" calcMode="spline"
        keySplines="0 0 1 1; 0 0 1 1; 0.25 0 0.12 1; 0 0 1 1"/>
      <path d="M-24 0 L-0.9 -1.9 L0.35 0 L-0.9 1.9 Z" fill="url(#sidhiyanaStarTrail)" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0.55;0.55;0.2;0.55;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M-18 0 L-0.2 -0.4 L0.7 0 L-0.2 0.4 Z" fill="url(#sidhiyanaStarTrailCore)" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0.55;0.55;0.2;0.55;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
      </path>
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.12;1;1;1;1;0.4;0.4" keyTimes="0;0.38;0.44;0.5;0.62;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="2.4" fill="#FFF8EC" opacity="0" filter="url(#sidhiyanaStarHeadGlow)">
          <animate attributeName="opacity" values="0;0;1;1;1;0.35;1;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
        </circle>
        <path d="M0 -5.4 L0.72 -0.72 L5.4 0 L0.72 0.72 L0 5.4 L-0.72 0.72 L-5.4 0 L-0.72 -0.72 Z" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;1;0.35;1;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
        </path>
        <circle cx="0" cy="0" r="1.25" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;1;0.35;1;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
        </circle>
        <path d="M0 -6.2 L0.78 -0.78 L6.2 0 L0.78 0.78 L0 6.2 L-0.78 0.78 L-6.2 0 L-0.78 -0.78 Z" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0.4;0;0.5;0;0" keyTimes="0;0.62;0.66;0.7;0.74;0.77;0.8;1" dur="11s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>

  <text x="122" y="148" fill="#FF7722" font-size="26" letter-spacing="0.4" class="wordmark">Sidhiyana pvt ltd</text>
  <text x="122" y="178" fill="#8d8281" font-size="14" letter-spacing="0.6" class="wordmark">..beyond imagination</text>
</svg>
