<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 440 110" role="img" aria-label="Sidhiyana Pvt Ltd">
  <title>Sidhiyana Pvt Ltd</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400&amp;display=swap');
      .wordmark { font-family: Orbitron, sans-serif; font-weight: 400; }
      @media (prefers-reduced-motion: reduce) {
        .sidhiyana-star-anim { display: none; }
      }
    </style>

    <linearGradient id="sidhiyanaNfSaffronFill" x1="35" y1="0" x2="110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F25A7A"/>
      <stop offset="18%" stop-color="#FF7722"/>
      <stop offset="100%" stop-color="#FF7722"/>
    </linearGradient>

    <clipPath id="sidhiyanaNfTopBarClip">
      <path d="M42.5 110 H103 V117.5 A7.5 7.5 0 0 1 95.5 125 H42.5 A7.5 7.5 0 0 1 42.5 110 Z"/>
    </clipPath>
    <clipPath id="sidhiyanaNfReverseCClip">
      <rect x="35" y="142" width="68" height="15" rx="7.5"/>
      <rect x="88" y="142" width="15" height="45" rx="7.5"/>
      <rect x="35" y="174" width="68" height="15" rx="7.5"/>
    </clipPath>

    <linearGradient id="sidhiyanaNfStarTrail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#FFF4E8" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#FFE0C0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF7722" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sidhiyanaNfStarTrailCore" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="sidhiyanaNfStarGlow" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sidhiyanaNfStarHeadGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Explicit fill required: root has no fill inheritance into clip text -->
    <clipPath id="sidhiyanaNfWordmarkClip">
      <text x="122" y="148" fill="#000000" font-size="26" letter-spacing="0.4" class="wordmark">Sidhiyana pvt ltd</text>
    </clipPath>
    <clipPath id="sidhiyanaNfTaglineClip">
      <text x="122" y="178" fill="#000000" font-size="14" letter-spacing="0.6" class="wordmark">..beyond imagination</text>
    </clipPath>
  </defs>

  <g fill="url(#sidhiyanaNfSaffronFill)">
    <path d="M42.5 110 H103 V117.5 A7.5 7.5 0 0 1 95.5 125 H42.5 A7.5 7.5 0 0 1 42.5 110 Z"/>
    <rect x="35" y="142" width="68" height="15" rx="7.5"/>
    <rect x="88" y="142" width="15" height="45" rx="7.5"/>
    <rect x="35" y="174" width="68" height="15" rx="7.5"/>
  </g>

  <!-- 1) Bottom reverse-C — star-focused shooting spark -->
  <g class="sidhiyana-star-anim" clip-path="url(#sidhiyanaNfReverseCClip)" filter="url(#sidhiyanaNfStarGlow)">
    <g>
      <animateMotion path="M42 181.5 H95.5 V149.5 H42" dur="11s" repeatCount="indefinite" rotate="auto"
        keyTimes="0;0.03;0.34;1" keyPoints="0;0;1;1" calcMode="spline"
        keySplines="0 0 1 1; 0.25 0 0.12 1; 0 0 1 1"/>
      <!-- Soft trail — enough length for launch zoom, star head stays hero -->
      <path d="M-24 0 L-0.9 -1.9 L0.35 0 L-0.9 1.9 Z" fill="url(#sidhiyanaNfStarTrail)" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M-18 0 L-0.2 -0.4 L0.7 0 L-0.2 0.4 Z" fill="url(#sidhiyanaNfStarTrailCore)" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0.55;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
      </path>
      <!-- Star head (hero) with launch zoom -->
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.12;1;1;0.4" keyTimes="0;0.02;0.05;0.2;0.32;1" dur="11s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="2.4" fill="#FFF8EC" opacity="0" filter="url(#sidhiyanaNfStarHeadGlow)">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
        </circle>
        <path d="M0 -5.4 L0.72 -0.72 L5.4 0 L0.72 0.72 L0 5.4 L-0.72 0.72 L-5.4 0 L-0.72 -0.72 Z" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
        </path>
        <circle cx="0" cy="0" r="1.25" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.05;0.32;0.38;1" dur="11s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- 2) Top bar — after bottom; early stop + mild shine -->
  <g class="sidhiyana-star-anim" clip-path="url(#sidhiyanaNfTopBarClip)" filter="url(#sidhiyanaNfStarGlow)">
    <g>
      <animateMotion path="M42 117.5 H90" dur="11s" repeatCount="indefinite" rotate="auto"
        keyTimes="0;0.38;0.42;0.62;1" keyPoints="0;0;0;1;1" calcMode="spline"
        keySplines="0 0 1 1; 0 0 1 1; 0.25 0 0.12 1; 0 0 1 1"/>
      <path d="M-24 0 L-0.9 -1.9 L0.35 0 L-0.9 1.9 Z" fill="url(#sidhiyanaNfStarTrail)" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0.55;0.55;0.2;0.55;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M-18 0 L-0.2 -0.4 L0.7 0 L-0.2 0.4 Z" fill="url(#sidhiyanaNfStarTrailCore)" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0.55;0.55;0.2;0.55;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
      </path>
      <g>
        <animateTransform attributeName="transform" type="scale" values="0.4;0.4;1.12;1;1;1;1;0.4;0.4" keyTimes="0;0.38;0.44;0.5;0.62;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
        <circle cx="0" cy="0" r="2.4" fill="#FFF8EC" opacity="0" filter="url(#sidhiyanaNfStarHeadGlow)">
          <animate attributeName="opacity" values="0;0;1;1;1;0.35;1;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
        </circle>
        <path d="M0 -5.4 L0.72 -0.72 L5.4 0 L0.72 0.72 L0 5.4 L-0.72 0.72 L-5.4 0 L-0.72 -0.72 Z" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;1;0.35;1;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
        </path>
        <circle cx="0" cy="0" r="1.25" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;1;0.35;1;0;0" keyTimes="0;0.38;0.44;0.62;0.66;0.7;0.74;0.8;1" dur="11s" repeatCount="indefinite"/>
        </circle>
        <path d="M0 -6.2 L0.78 -0.78 L6.2 0 L0.78 0.78 L0 6.2 L-0.78 0.78 L-6.2 0 L-0.78 -0.78 Z" fill="#FFFFFF" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0.4;0;0.5;0;0" keyTimes="0;0.62;0.66;0.7;0.74;0.77;0.8;1" dur="11s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>

  <text x="122" y="148" fill="#FF7722" font-size="26" letter-spacing="0.4" class="wordmark">Sidhiyana pvt ltd</text>
  <text x="122" y="178" fill="#8d8281" font-size="14" letter-spacing="0.6" class="wordmark">..beyond imagination</text>

  <!-- Mild wordmark flash — secondary to shooting star -->
  <g class="sidhiyana-star-anim" clip-path="url(#sidhiyanaNfWordmarkClip)">
    <rect x="100" y="120" width="48" height="36" fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.14;0.14;0;0" keyTimes="0;0.62;0.63;0.78;0.79;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x" values="100;100;350;350" keyTimes="0;0.62;0.78;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </rect>
    <rect x="100" y="120" width="28" height="36" fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.26;0.26;0;0" keyTimes="0;0.62;0.63;0.78;0.79;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x" values="100;100;350;350" keyTimes="0;0.62;0.78;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </rect>
  </g>

  <!-- Mild tagline flash -->
  <g class="sidhiyana-star-anim" clip-path="url(#sidhiyanaNfTaglineClip)">
    <rect x="100" y="162" width="36" height="22" fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.14;0.14;0;0" keyTimes="0;0.72;0.73;0.88;0.89;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x" values="100;100;300;300" keyTimes="0;0.72;0.88;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </rect>
    <rect x="100" y="162" width="21" height="22" fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.26;0.26;0;0" keyTimes="0;0.72;0.73;0.88;0.89;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x" values="100;100;300;300" keyTimes="0;0.72;0.88;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.2 0 0.1 1; 0 0 1 1"/>
    </rect>
  </g>
</svg>
